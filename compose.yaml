services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27018:27017"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: sales-services-crm-server
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/sales-service-crm
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    image: sales-services-crm-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo-data:
